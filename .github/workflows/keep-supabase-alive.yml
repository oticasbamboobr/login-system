name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Oticas Bamboo Brasil
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -o /dev/null \
            -H "apikey: $SUPABASE_KEY" \
            "https://dvgglikbahumgfjuzben.supabase.co/rest/v1/app_data?select=key&limit=1"
